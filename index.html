<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./src/styles/main.css">
    <title>IDC Widget</title>
</head>
<body>
<section class="idc-widget-container">
    <div id="idc-widget-new"></div>
</section>
<section class="idc-widget-container">
    <div id="idc-widget-hits"></div>
</section>
<section class="idc-widget-container">
    <div id="idc-widget-5g-duplicates"></div>
</section>
<section class="idc-widget-container">
    <div id="idc-widget-5g"></div>
</section>

<script type="module">
    import {initWidget} from "./src/index.js";
    initWidget("idc-widget-new")
    initWidget("idc-widget-hits", {
        collectionIds:[5]
    })
    initWidget("idc-widget-5g-duplicates", {
        apiUrl: 'https://shop.idc.md/api/v1/shop/categories/smarts?filter[attribute][5g][]=yes',
        dataPath: 'data.products.data',
        dataType: 'products',
        title: 'Телефоны с 5G'
    })
    initWidget("idc-widget-5g", {
        apiUrl: 'https://shop.idc.md/api/v1/shop/categories/smarts?filter[attribute][5g][]=yes',
        dataPath: 'data.products.data',
        dataType: 'products',
        title: 'Телефоны с 5G (без дупликатов)',
        deduplicateByName: true
    })
</script>
</body>
</html>
